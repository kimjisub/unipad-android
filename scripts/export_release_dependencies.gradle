import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// An init script keeps this inspection task out of the app's build configuration.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportReleaseDependencies') {
        doLast {
            def result = app.configurations.releaseRuntimeClasspath.incoming.resolutionResult
            def unresolved = result.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
            if (!unresolved.empty) {
                throw new GradleException("Unresolved release dependencies: ${unresolved*.attempted}")
            }
            def dependencies = result.allComponents.findAll {
                it.id instanceof ModuleComponentIdentifier
            }.collect {
                [name: "${it.id.group}:${it.id.module}".toString(), version: it.id.version]
            }.unique().sort { a, b -> a.name <=> b.name ?: a.version <=> b.version }
            if (dependencies.empty) {
                throw new GradleException('No Maven release dependencies were resolved')
            }
            def output = app.rootProject.file(app.findProperty('dependencyAuditOutput') ?:
                'build/security/release-dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(dependencies)) + '\n'
            println "Exported ${dependencies.size()} resolved release dependencies to ${output}"
        }
    }
}
