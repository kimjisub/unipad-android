import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

apply plugin: 'com.android.library'

android {
	compileSdk = 37
	defaultConfig {
		minSdkVersion 24
		targetSdkVersion 36
		testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
		vectorDrawables.useSupportLibrary = true
	}
	buildTypes {
		release {
			// Library modules should not minify independently — the app module's R8 handles it
			minifyEnabled = false
			consumerProguardFiles 'proguard-rules.pro'
		}
		debug {
			minifyEnabled = false
		}
	}
	buildFeatures {
		viewBinding = true
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_21
		targetCompatibility JavaVersion.VERSION_21
	}
	tasks.withType(KotlinCompile).configureEach {
		compilerOptions {
			jvmTarget = JvmTarget.JVM_21
			allWarningsAsErrors = true
		}
	}

	namespace = 'com.kimjisub.design'
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	testImplementation 'junit:junit:4.13.2'

	implementation 'androidx.appcompat:appcompat:1.8.0'
	implementation 'androidx.core:core-ktx:1.19.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
	androidTestImplementation 'androidx.test:runner:1.7.0'
	androidTestImplementation 'androidx.test.ext:junit:1.3.0'
	androidTestImplementation 'junit:junit:4.13.2'
}

// Prepare installed debug/test code before Orchestrator starts a fresh process per test.
// AGP's test engine performs this device compilation; APKs and release variants are unchanged.
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.experimentalProperties.put('android.experimental.force-aot-compilation', true)
    }
}
