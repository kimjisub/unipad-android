name: Android checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set the initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Run all app and design unit tests
        timeout-minutes: 12
        run: ./gradlew :app:testDebugUnitTest :design:testDebugUnitTest --no-daemon --console=plain
      # The UI suite runs on the Mac before push; its pass/fail verdict script is checked here with fake adb and Gradle.
      - name: Check the UI test runner verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            design/build/test-results/testDebugUnitTest/
            design/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set the initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Build every debug module and compile both Kotlin variants
        run: ./gradlew assembleDebug :app:compileDebugKotlin :app:compileReleaseKotlin :design:compileDebugKotlin :design:compileReleaseKotlin --no-daemon --console=plain

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set the initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Check every debug module
        run: ./gradlew lintDebug --no-daemon --console=plain
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-results
          path: '**/build/reports/lint-results-debug.*'
          if-no-files-found: warn
          retention-days: 7

