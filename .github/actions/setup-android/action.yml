name: Set up Android checks
description: Install the pinned toolchain and use service-free test configuration
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        cache-read-only: true
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        cmdline-tools-version: '15859902'
        packages: ''
        accept-android-sdk-licenses: false
        log-accepted-android-sdk-licenses: false
    - name: Install Android SDK packages
      shell: bash
      run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-37.0 build-tools/36.0.0 ndk/29.0.14206865 cmake/3.22.1
    - name: Use test-only Firebase configuration
      shell: bash
      run: cp .github/fixtures/google-services.json app/google-services.json
